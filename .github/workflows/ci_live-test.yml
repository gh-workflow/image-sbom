name: "CI: live test"

"on":
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-attestation:
    name: Build image and attest SBOM (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: image-manifest
            platforms: linux/amd64
            provenance: "false"
            expected-media: manifest
            expected-images: "1"
            expected-non-runnable: "0"
          - case: single-image-index
            platforms: linux/amd64
            provenance: mode=max
            expected-media: index
            expected-images: "1"
            expected-non-runnable: "1"
          - case: multi-image-index
            platforms: linux/amd64,linux/arm64
            provenance: "false"
            expected-media: index
            expected-images: "2"
            expected-non-runnable: "0"
          - case: multi-image-index-with-attestations
            platforms: linux/amd64,linux/arm64
            provenance: mode=max
            expected-media: index
            expected-images: "2"
            expected-non-runnable: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image
        id: image
        env:
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          TEST_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}-live-test"
          tag="${image}:${RUN_ID}-${TEST_CASE}"

          {
            echo "context=tests/live-image"
            echo "image=${image}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push test image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.image.outputs.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: ${{ matrix.provenance }}
          sbom: false
          tags: ${{ steps.image.outputs.tag }}

      - name: Generate and attest SBOM
        id: sbom
        uses: ./
        with:
          image: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SBOM attestations
        env:
          IMAGE: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          SBOM_DIR: ${{ steps.sbom.outputs.sbom-dir }}
          EXPECTED_MEDIA: ${{ matrix.expected-media }}
          EXPECTED_IMAGES: ${{ matrix.expected-images }}
          EXPECTED_NON_RUNNABLE: ${{ matrix.expected-non-runnable }}
        run: scripts/verify-live-case.sh

      - name: Test SBOM reader
        env:
          IMAGE: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          EXPECTED_IMAGES: ${{ matrix.expected-images }}
        run: |
          set -euo pipefail
          scripts/show-sbom.sh "${IMAGE}" --packages |
            awk -F '\t' '$1 == "busybox" { found = 1 } END { exit !found }'
          if [[ "${EXPECTED_IMAGES}" -gt 1 ]]; then
            scripts/show-sbom.sh "${IMAGE}" --platform linux/arm64 --packages |
              awk -F '\t' '$1 == "busybox" { found = 1 } END { exit !found }'
          fi
