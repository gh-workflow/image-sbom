name: "CI: live test"

"on":
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-attestation:
    name: Build image and attest SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image
        id: image
        env:
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}-live-test"
          tag="${image}:${RUN_ID}"

          {
            echo "context=tests/live-image"
            echo "image=${image}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.image.outputs.context }}
          push: true
          sbom: false
          tags: ${{ steps.image.outputs.tag }}

      - name: Generate and attest SBOM
        id: sbom
        uses: ./
        with:
          image: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SBOM file
        env:
          SBOM_DIR: ${{ steps.sbom.outputs.sbom-dir }}
        run: |
          set -euo pipefail
          find "${SBOM_DIR}" -type f -name '*.spdx.json' -print -quit \
            | xargs jq -e '.SPDXID == "SPDXRef-DOCUMENT"' >/dev/null

      - name: Verify attestation exists
        env:
          IMAGE: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_repo="${IMAGE%@sha256:*}"
          resolved_image="$(
            docker buildx imagetools inspect --raw "${IMAGE}" \
              | jq -r --arg image_repo "${image_repo}" '
                .manifests[]
                | select(.platform.os != null and .platform.architecture != null)
                | select(.platform.os != "unknown" and .platform.architecture != "unknown")
                | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                | "\($image_repo)@\(.digest)"
              ' \
              | head -n 1
          )"
          if [[ -z "${resolved_image}" ]]; then
            echo "No runnable image manifest found for ${IMAGE}." >&2
            exit 1
          fi

          attestation_file="${RUNNER_TEMP}/attestations.json"
          cosign download attestation "${resolved_image}" > "${attestation_file}"
          jq -e '
            select(
              .dsseEnvelope.payload
              | @base64d
              | fromjson
              | .predicate.SPDXID == "SPDXRef-DOCUMENT"
            )
          ' "${attestation_file}" >/dev/null
