name: Image SBOM attestation
description: Generate an SBOM for a container image and attach it as a Cosign attestation.
author: gh-workflow

branding:
  icon: shield
  color: blue

inputs:
  image:
    description: Image reference to scan and attest, usually image@sha256:digest.
    required: true
  registry-username:
    description: >
      Registry username used by Syft and Cosign for image registry access. Usually github.actor for GHCR images.
    required: false
  registry-password:
    description: >
      Registry password or token used by Syft and Cosign for image registry access.
      Usually secrets.GITHUB_TOKEN for GHCR images.
    required: false
  format:
    description: SBOM format to generate. Supported values are spdx-json and cyclonedx-json.
    required: false
    default: spdx-json

outputs:
  sbom-file:
    description: Path to the generated SBOM file on the runner.
    value: ${{ steps.paths.outputs.SBOM_FILE }}

runs:
  using: composite
  steps:
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Prepare paths
      id: paths
      shell: bash
      env:
        FORMAT: ${{ inputs.format }}
      run: |
        set -euo pipefail
        sbom_dir="$(mktemp -d "${RUNNER_TEMP}/image-sbom.XXXXXX")"
        case "${FORMAT}" in
          spdx-json)
            echo "SBOM_FILE=${sbom_dir}/sbom.spdx.json" >>"${GITHUB_OUTPUT}"
            echo "PREDICATE_TYPE=spdxjson" >>"${GITHUB_OUTPUT}"
            ;;
          cyclonedx-json)
            echo "SBOM_FILE=${sbom_dir}/sbom.cyclonedx.json" >>"${GITHUB_OUTPUT}"
            echo "PREDICATE_TYPE=cyclonedx" >>"${GITHUB_OUTPUT}"
            ;;
          *)
            echo "::error::Unsupported format '${FORMAT}'. Supported values are: spdx-json, cyclonedx-json."
            exit 1
            ;;
        esac

    - name: Generate SBOM
      uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
      with:
        image: ${{ inputs.image }}
        registry-username: ${{ inputs.registry-username }}
        registry-password: ${{ inputs.registry-password }}
        format: ${{ inputs.format }}
        output-file: ${{ steps.paths.outputs.SBOM_FILE }}
        upload-artifact: false
        upload-release-assets: false

    - name: Attest SBOM
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PREDICATE_TYPE: ${{ steps.paths.outputs.PREDICATE_TYPE }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        SBOM_FILE: ${{ steps.paths.outputs.SBOM_FILE }}
      run: |
        set -euo pipefail
        signing_config="${RUNNER_TEMP}/cosign-signing-config.json"
        cosign signing-config create \
          --with-default-services \
          --no-default-rekor \
          --out "${signing_config}"

        cosign_args=(
          attest
          --yes
          --predicate "${SBOM_FILE}"
          --type "${PREDICATE_TYPE}"
          --signing-config "${signing_config}"
        )

        if [[ -n "${REGISTRY_USERNAME}" || -n "${REGISTRY_PASSWORD}" ]]; then
          if [[ -z "${REGISTRY_USERNAME}" || -z "${REGISTRY_PASSWORD}" ]]; then
            echo "::error::registry-username and registry-password must be provided together."
            exit 1
          fi

          cosign_args+=(
            --registry-username "${REGISTRY_USERNAME}"
            --registry-password "${REGISTRY_PASSWORD}"
          )
        fi

        cosign "${cosign_args[@]}" "${IMAGE}"
